AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  TerraSense Backend
  SAM Template for AWS Lambda and DynamoDB architecture

Globals:
  Function:
    Timeout: 15
    Runtime: python3.12
    MemorySize: 256
    Environment:
      Variables:
        TABLE_NAME: !Ref IncidentsTable
        CORS_ALLOW_ORIGIN: "*"

Resources:
  IncidentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: terrasense-incidents
      AttributeDefinitions:
        - AttributeName: incident_id
          AttributeType: S
        - AttributeName: created_at
          AttributeType: S
      KeySchema:
        - AttributeName: incident_id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      GlobalSecondaryIndexes:
        - IndexName: CreatedAtIndex
          KeySchema:
            - AttributeName: incident_id
              KeyType: HASH
            - AttributeName: created_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  TerraSenseApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Cors:
        AllowMethods: "'GET,POST,PATCH,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        AllowOrigin: "'*'"

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: app/
      Handler: main.handler
      Events:
        ApiProxy:
          Type: Api
          Properties:
            RestApiId: !Ref TerraSenseApi
            Path: /{proxy+}
            Method: any
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref IncidentsTable

Outputs:
  ApiUrl:
    Description: "API Gateway endpoint URL for Prod stage"
    Value: !Sub "https://${TerraSenseApi}.execute-api.${AWS::Region}.amazonaws.com/prod/api"
